{id:7,name:"加拿大一枝黄花",img:"jianadayizhihuanghua",latin:"Solidago canadensis",life:"多年生草本",origin:"北美洲",geo:"北温带",group:"被子植物",shape:"头状花序很小，在花序分枝单面着生，多数弯曲的花序分枝与单面着生的头状花序，形成开展的圆锥状花序。总苞片线状披针形，边缘舌状花很短。茎直立、秆粗壮，下部一般无分枝，常成紫红色。叶片披针形或线状披针形，互生，顶渐尖，基部楔形，近无柄。大多呈三出脉，边缘具锯齿。蝎尾状圆锥花序，具向外伸展的分支。",habit:"喜光、耐旱、耐贫瘠；偏好开阔、受干扰的环境，也能适应多种土壤",harm:"加拿大一枝黄花的危害主要表现在对本地生态平衡的破坏和对本地生物多样性的威胁。这是由于加拿大一枝黄花具有强大的竞争优势，体现在：①繁殖能力强，无性有性结合；②传播能力强，远近结合；③生长期长，在其他秋季杂草枯萎或停止生长的时候，加拿大一枝黄花依然茂盛，花黄叶绿，而且地下根茎继续横走，不断蚕食其他杂草的领地，而此时其他杂草已无力与之竞争。加拿大一枝黄花还可以抑制糖槭幼苗生长，也抑制包括自身在内的草本植物发芽。",area:"鹭鸶湾、迎宾路",count:2,"points":[[110.3005,29.0645],[110.2859,29.0708]]},
{id:8,name:"翅果菊",img:"chiguoju",latin:"Pterocypsela indica",life:"一二年生草本",origin:"亚洲",geo:"温带亚洲",group:"被子植物",shape:"全部茎枝无毛，全部茎叶线形，顶端长渐急尖或渐尖，基部楔形渐狭，无柄，两面无毛，头状花序果期卵球形，多数沿茎枝顶端排成圆锥花序或总状圆锥花。生长于山谷、山坡、林缘及林下、灌丛中或水沟边、山坡草地或田间。",habit:"喜温暖湿润、阳光充足的环境，既耐热、耐旱也耐寒",harm:"无",area:"交警支队、大堰、西站、人民医院、张家界学院",count:5,"points":[[110.2728,29.084],[110.275,29.0958],[110.2728,29.1113],[110.2735,29.1022],[110.2644,29.0911]]},
{id:9,name:"豚草",img:"tuncao",latin:"Ambrosia artemisiifolia",life:"一年生草本",origin:"北美洲",geo:"东亚北美间断",group:"被子植物",shape:"一年生草本，茎直立，上部有圆锥状分枝，有棱，被疏生密糙毛。下部叶对生，具短叶柄，二次羽状分裂，裂片狭小，长圆形至倒披针形，全缘，有明显中脉，上面深绿色，被细短伏毛或近无毛，背面灰绿色，被密短糙毛；上部叶互生，无柄，羽状分裂。雄头状花序半球形或卵形，具短梗，下垂，在枝端密集成总状花序。总苞宽半球形或碟形；总苞片全部结合，无肋，边缘具波状圆齿，稍被糙伏毛。花托具刚毛状托片；花冠淡黄色，有短管部，上部钟状，有宽裂片；花药卵圆形；花柱不分裂，顶端膨大成画笔状。雌头状花序无花序梗，在雄头花序下面或在下部叶腋单生，或2-3个密集成团伞状，有1个无被能育的雌花，总苞闭合，具结合的总苞片，倒卵形或卵状长圆形，顶端有围裹花柱的圆锥状嘴部，在顶部以下有4-6个尖刺，稍被糙毛；花柱2深裂，丝状，伸出总苞的嘴部。瘦果倒卵形，无毛，藏于坚硬的总苞中。花期8-9月，果期9-10月。",habit:"适应性强，喜光，耐旱耐瘠，生长迅速，繁殖力强（种子产量大），花粉致敏。",harm:"其产生的花粉是人类花粉过敏症的主要致病源。豚草的茎和叶释放的化感物质对禾本科、豆科、菊科植物有抑制作用，还具有极强的生命力、竞争力和生态可塑性，破坏本土生物多样性，造成农业减产。",area:"市政府、仙人溪桥",count:2,"points":[[110.2829,29.0713],[110.2821,29.0653]]},
{id:10,name:"牛膝菊",img:"niuxiju",latin:"Galinsoga parviflora",life:"一年生草本",origin:"南美洲",geo:"世界分布",group:"被子植物",shape:"一年生草本，茎纤细，或粗壮，基部不分枝或自基部分枝，分枝斜升，全部茎枝被疏散或上部稠密的贴伏短柔毛和少量腺毛，茎基部和中部花期脱毛或稀毛。叶对生，卵形或长椭圆状卵形，基部圆形、宽或狭楔形，顶端渐尖或钝，基出三脉或不明显五出脉，在叶下面稍突起，在上面平，有叶柄，向上及花序下部的叶渐小，通常披针形；全部茎叶两面粗涩，被白色稀疏贴伏的短柔毛，沿脉和叶柄上的毛较密，边缘浅或钝锯齿或波状浅锯齿，在花序下部的叶有时全缘或近全缘。头状花序半球形，有长花梗，多数在茎枝顶端排成疏松的伞房花序，总苞半球形或宽钟状，外层短，内层卵形或卵圆形，顶端圆钝，白色，膜质。舌状花4-5个，舌片白色，顶端3齿裂，筒部细管状，外面被稠密白色短柔毛；管状花花冠黄色，下部被稠密的白色短柔毛。托片倒披针形或长倒披针形，纸质，顶端3裂或不裂或侧裂。",habit:"喜潮湿、肥沃土壤，耐阴，种子产量大，生长迅速，常入侵农田、菜园等。",harm:"入侵牛膝菊属植物通常危害小麦、玉米、棉花、烟草等作物，这种植物最重要的特征是，种子没有休眠或休眠程度低，生长迅速，开花早，同一生长季节可发生多代，种子量大，适生环境广泛。在适应的环境条件下，牛膝菊营养生长迅速，使其成为农田中的一种恶性杂草。这些特征使牛膝菊很易扩散，并建立大的杂草种群，以至于很难防治。牛膝菊会与作物，尤其是与灌溉的矮杆作物竞争营养和生态位，甚至影响作物收成。牛膝菊对大豆和花生也具有一定的化感作用，影响种子的萌发和胚根的伸长。并且牛膝菊的化感作用地上部分比地下部分要强，但其化感能力却受低温环境的影响。",area:"大溶溪防护绿地",count:21,"points":[]},
{id:11,name:"白花鬼针草",img:"baihuaguizhencao",latin:"Bidens alba",life:"一年生草本",origin:"亚洲",geo:"热带亚、美洲间断",group:"被子植物",shape:"茎钝四棱形，无毛或上部被极稀的柔毛，茎钝四棱形，无毛或上部被极稀的柔毛。头状花序，层托片披针形，内层条状披针形，舌状花，瘦果黑色，条形，具倒刺毛。生于村旁、路边及临野。",habit:"喜温暖湿润，耐旱耐瘠，依靠具倒刺的瘦果进行动物传播和快速繁殖",harm:"无",area:"兑泽路、101乡道、武陵山大道、吉大安置小区",count:5,"points":[[110.2724,29.0929],[110.2706,29.0843],[110.2717,29.0811],[110.2715,29.0806],[110.2805,29.0754],[110.2812,29.0747],[110.3314,29.0816],[110.3109,29.0728]]},
{id:12,name:"大狼耙草",img:"dalangpacao",latin:"Bidens frondosa",life:"一年生草本",origin:"美洲",geo:"热带亚、美洲间断",group:"被子植物",shape:"叶对生，一回羽状复叶，具柄，叶背面有稀疏短柔毛，头状花序单生茎端和枝端，瘦果扁平。适应性强，山坡、山谷、溪边、草丛及路旁均可生，喜温暖潮湿环境。生于水边湿地、沟渠及浅水滩，亦生于路边荒野，常发生在稻田边。到处都能生长，不耐荫，在密植田或高秆作物中生长发育不好。",habit:"喜温暖潮湿环境，通过倒刺芒刺高效传播种子，被列为1级恶意入侵物种",harm:"与农物争夺水分、养分和光能。是作物病害和虫害的中间寄主，降低农作物产量和品质，影响人、畜健康，增加管理用工和生产成本。",area:"热水坑、太极溪、张家界学院、武陵山大道、龙源华城、大溶溪、金海学校、逸臣公园、大庸桥、荣盛华府",count:3,"points":[[110.2728,29.0844],[110.273,29.0906],[110.2644,29.0911],[110.2706,29.0843],[110.2632,29.0815],[110.25,29.0759],[110.2604,29.0737],[110.2717,29.0811],[110.2715,29.0806],[110.2709,29.0755],[110.2805,29.0754],[110.2918,29.0743],[110.3005,29.0645],[110.3136,29.0721],[110.2829,29.0713],[110.2859,29.0708]]},
{id:13,name:"刺苋",img:"cixian",latin:"Amaranthus spinosus",life:"一年生草本",origin:"美洲",geo:"世界分布",group:"被子植物",shape:"叶片菱状卵形或卵状披针形，圆锥花序腋生及顶生，生长在旷地、园圃、农耕地等。刺苋叶腋有刺，且部分苞片变形成刺，极易和该属其他种区别。",habit:"喜温暖、耐旱耐瘠，凭借极强的适应性和惊人的种子产量，成为果园、旱地等生境中的优势杂草。",harm:"危害农田，具刺，伤害人畜",area:"人民医院、张家界学院、大溶溪、逸臣公园、大庸桥、阳湖坪路、陈家溪桥",count:8,"points":[[110.2728,29.1113],[110.2644,29.0911],[110.25,29.0759],[110.2717,29.0811],[110.2715,29.0806],[110.3305,29.0749],[110.3136,29.0721]]},
{id:14,name:"反枝苋",img:"fanzhixian",latin:"Amaranthus retroflexus",life:"一年生草本",origin:"美洲",geo:"世界分布",group:"被子植物",shape:"茎，密生短柔毛，叶片菱状卵形或椭圆状卵形，全缘或波状缘，两面及边缘有柔毛，下面毛较密。圆锥花序顶生及腋生。胞果扁卵形。生在田园内、农地旁、人家附近的草地上，有时生在瓦房上。",habit:"喜温暖，耐旱，耐瘠薄，繁殖力强，种子产量高，是旱地恶性杂草。",harm:"危害农作物：反枝苋主要危害棉花、豆类、花生、蔬菜等多种旱作物。反枝苋混生在大豆、小麦、等果园和菜园中，可严密遮光和阻碍通风，消耗大量地力，抑制作物生长。还常常污染作物种子。反枝苋也是许多昆虫、线虫、病毒、细菌和真菌的寄主。危害家畜",area:"热水坑、太极溪、人民医院、张家界学院、大溶溪、金海学校、逸臣公园、荣盛华府、滨河路、阳湖坪路",count:9,"points":[[110.2748,29.084],[110.2728,29.0844],[110.273,29.0906],[110.2728,29.1113],[110.2644,29.0911],[110.25,29.0759],[110.2604,29.0737],[110.2717,29.0811],[110.2709,29.0755],[110.2805,29.0754],[110.2812,29.0747],[110.3305,29.0749]]},
{id:15,name:"青葙",img:"qingxiang",latin:"Celosia argentea",life:"一年生草本",origin:"非洲",geo:"热带亚洲至非洲",group:"被子植物",shape:"叶片绿色常带红色，顶端急尖或渐尖，具小芒尖，基部渐狭，花多数，密生，在茎端或枝端成单一、无分枝的塔状或圆柱状穗状花序，苞片及小苞片披针形顶端渐尖，延长成细芒，胞果卵形，种子凸透镜状肾形，种子呈扁圆形，少数呈圆肾形，表面黑色或红黑色，光亮，中间微隆起，侧边微凹处有种脐。表面于放大镜下观察可见网状纹理种子易粘手，种皮薄而脆，气无，味淡。喜生于石灰性土壤和肥沃的砂壤土，在粘性土壤中也能生长，在低洼积水的地方容易烂根。",habit:"喜光，耐旱，耐瘠薄，适应性强，种子繁殖力强。",harm:"无",area:"热水坑、太极溪、交警支队、沙堤大道、金海学校、张家界学院、逸臣公园、兑泽路",count:12,"points":[[110.2748,29.084],[110.2728,29.0844],[110.273,29.0906],[110.2728,29.084],[110.2753,29.1018],[110.2644,29.0911],[110.2604,29.0737],[110.2717,29.0811],[110.2805,29.0754],[110.3109,29.0728]]},
{id:16,name:"空心莲子草",img:"kongxinlianzicao",latin:"Alternanthera philoxeroides",life:"多年生草本",origin:"美洲",geo:"世界温带",group:"被子植物",shape:"茎基部匍匐，上部上升，管状，幼茎及叶腋有白色或锈色柔毛，茎老时无毛，叶片矩圆形、矩圆状倒卵形或倒卵状披针形，两面无毛或上面有贴生毛及缘毛，下面有颗粒状突起，花密生，成具总花梗的头状花序，果实未见。生长在池沼、水沟内。",habit:"适应性强，喜湿耐阴，但也能在旱地生长，繁殖能力强",harm:"在新环境里繁殖蔓延，与当地种竞争生长所需资源使本地种的生长受到胁迫，导致群落的生存空间降低。空心莲子草入侵某群落后，通常会形成大小不等的斑块状群落镶嵌体，随入侵时间的增加，它又会通过快速的分枝使盖度不断增加。",area:"张家界学院、大溶溪、逸臣公园、大庸桥、荣盛华府、滨河路、大庸古城、福天、黄沙泉、101乡道、市政府、迎宾路、致远、小红帽、南庄坪、民怡家园、三邢路",count:22,"points":[[110.2644,29.0911],[110.25,29.0759],[110.2717,29.0811],[110.2715,29.0806],[110.2709,29.0755],[110.2805,29.0754],[110.2812,29.0747],[110.2859,29.072],[110.2918,29.0743],[110.2932,29.0815],[110.2918,29.0742],[110.3005,29.0645],[110.3314,29.0816],[110.2829,29.0713],[110.2859,29.0708],[110.2814,29.0649],[110.2758,29.0649],[110.2747,29.0641],[110.2756,29.0628],[110.2743,29.0622],[110.2736,29.0636],[110.33,29.0751]]},
{id:17,name:"土荆芥",img:"tujingjie",latin:"Dysphania ambrosioides",life:"多年生草本",origin:"美洲",geo:"世界分布",group:"被子植物",shape:"一年生或多年生草本，有强烈香味。茎直立，多分枝，有色条及钝条棱；枝通常细瘦，有短柔毛并兼有具节的长柔毛，有时近于无毛。叶片矩圆状披针形至披针形，先端急尖或渐尖，边缘具稀疏不整齐的大锯齿，基部渐狭具短柄，上面平滑无毛，下面有散生油点并沿叶脉稍有毛，上部叶逐渐狭小而近全缘。花两性及雌性，生于上部叶腋；果时通常闭合；雄蕊5，花药长0.5毫米；花柱不明显，柱头通常3,较少为4，丝形，伸出花被外。胞果扁球形，完全包于花被内。种子横生或斜生，黑色或暗红色，平滑，有光泽，边缘钝，花期和果期的时间都很长。",habit:"喜光、耐旱、适应性强，具有化感作用，种子繁殖能力强。",harm:"种群数量大，对生长环境要求不严，极易扩散，常常侵入并威胁种植在长江大堤上的草坪。含有毒的挥发油，对其他植物产生化感作用。也是花粉过敏源，对人体健康有害。土荆芥通过化感作用在不同程度上抑制它们种子的萌发，从而改变它们的种植密度，浪费率土地的利用率；对根长和茎高的抑制将导致植株的产量降低，最终导致农作物减产。",area:"兑泽路、陈家溪桥、逸臣公园、金海学校、龙源华城",count:12,"points":[[110.2632,29.0815],[110.2604,29.0737],[110.2717,29.0811],[110.3109,29.0728],[110.3136,29.0721]]},
{id:18,name:"菟丝子",img:"tusizi",latin:"Cuscuta chinensis",life:"一年生草本",origin:"亚洲",geo:"热带亚洲至大洋洲",group:"被子植物",shape:"茎缠绕，黄色，纤细，花序侧生，少花或多花簇生成小伞形或小团伞花序，鳞片长圆形，边缘长流苏状，蒴果球形，表面粗糙。",habit:"寄生植物，依靠吸器缠绕寄主获取养分，适应性强，种子休眠期长；对寄主有选择性，喜光，种子可存活多年。",harm:"园林植物受其寄生危害，轻则影响植物生长和观赏效果，重则致植物死亡。",area:"大溶溪、张家界学院",count:2,"points":[[110.2644,29.0911],[110.25,29.0759]]},
{id:19,name:"三裂叶薯",img:"sanlieyeshu",latin:"Ipomoea triloba",life:"一年生草本",origin:"美洲",geo:"泛热带",group:"被子植物",shape:"茎缠绕或有时平卧，无毛或散生毛，且主要在节上。叶宽卵形至圆形，全缘或有粗齿或深3裂，基部心形，两面无毛或散生疏柔毛；叶柄无毛或有时有小疣。花序腋生，花序梗短于或长于叶柄，较叶柄粗壮，无毛，明显有棱角，顶端具小疣，花梗多少具棱，有小瘤突，无毛，苞片小，披针状长圆形；萼片近相等或稍不等，外萼片稍短或近等长，长圆形，钝或锐尖，背部散生疏柔毛，边缘明显有缘毛，内萼片有时稍宽，椭圆状长圆形，锐尖，具小短尖头，无毛或散生毛；花冠漏斗状，无毛，淡红色或淡紫红色，雄蕊内藏，花丝基部有毛；子房有毛。蒴果近球形，具花柱基形成的细尖，被细刚毛，2室，4瓣裂。种子4或较少，无毛。",habit:"喜光喜湿、适应性极强，凭借缠绕攀附的快速生长和大量种子繁殖，成为一种危害生态的入侵植物",harm:"覆盖排挤本土植物危害方式主要为排挤和覆盖，其次为缠绕、生化相克、寄生及致敏，约有3/4的有害植物(直立的草本植物)以排挤方式进行危害，即以大量快速的繁殖方式形成密集的种群，侵占地盘，将其他植物驱赶、排挤出生境甚至杀灭掉。",area:"人民医院、张家界学院",count:2,"points":[[110.2728,29.1113]]},
{id:20,name:"垂序商陆",img:"chuixushanglu",latin:"Phytolacca americana",life:"多年生草本",origin:"北美洲",geo:"东亚北美间断",group:"被子植物",shape:"根粗壮，肥大，倒圆锥形。茎直立，圆柱形，有时带紫红色。叶片椭圆状卵形或卵状披针形，顶端急尖，基部楔形；总状花序顶生或侧生，花白色，微带红晕，花被片5，雄蕊、心皮及花柱通常均为10，心皮合生。果序下垂；浆果扁球形，熟时紫黑色；种子肾圆形，直径约3毫米。花期6~8月。",habit:"喜温暖湿润，具有强大的无性繁殖和鸟类传播种子的能力，成为一级恶性入侵物种",harm:"对环境要求不严格，生长迅速，在营养条件较好时，易形成单优群落，与其他植物竞争养料。其茎具有一定的蔓性，叶片宽阔，能覆盖其他植物体，导致其他植物生长不良甚至死亡。还具有较为肥大的肉质直根，消耗土壤肥力，根及浆果对人和牲畜有毒害作用。",area:"人民医院、沙堤大道、交警支队、武陵山大道、金海学校、张家界学院、热水坑、吉大安置、福天、逸臣桃源",count:1,"points":[[110.2748,29.084],[110.2728,29.0844],[110.2728,29.084],[110.2753,29.1018],[110.2728,29.1113],[110.2724,29.0929],[110.2644,29.0911],[110.2706,29.0843],[110.25,29.0759],[110.2604,29.0737],[110.2709,29.0755],[110.2918,29.0743],[110.2932,29.0815],[110.2918,29.0742],[110.3005,29.0645],[110.3222,29.0759],[110.3136,29.0721],[110.3158,29.0708],[110.2859,29.0708],[110.2757,29.0649],[110.2757,29.0647]]},
{id:21,name:"风车草",img:"fengchecao",latin:"Cyperus involucratus",life:"多年生草本",origin:"非洲",geo:"世界分布",group:"被子植物",shape:"多年生草本，根状茎短，粗大，须根坚硬。秆稍粗壮，近圆柱状，上部稍粗糙，基部包裹以无叶的鞘，鞘棕色。叶顶生为伞状。苞片20枚，长几相等，向四周展开，平展；多次复出长侧枝聚伞花序具多数第一次辐射枝，小穗密集于第二次辐射枝上端，椭圆形或长圆状披针形，小穗轴不具翅；鳞片紧密的复瓦状排列，膜质，卵形，顶端渐尖，苍白色，具锈色斑点，或为黄褐色，具3-5条脉；雄蕊3，花药线形，顶端具刚毛状附属物；花柱短，柱头3。小坚果椭圆形，近于三棱形，长为鳞片的1/3，褐色。花两性，花果期8-11月。",habit:"喜温暖湿润、阳光充足，也耐半阴甚耐寒，对土壤要求不严，常依水生于沼泽、河岸等湿地环境",harm:"无",area:"市政府、西站",count:1,"points":[[110.2735,29.1022],[110.2805,29.0754],[110.2829,29.0713]]},
{id:22,name:"满江红",img:"manjianghong",latin:"Azolla pinnata subsp.asiatica",life:"漂浮蕨类",origin:"亚洲",geo:"中国特有",group:"蕨类",shape:"植物体呈卵形或三角状，根状茎细长横走，侧枝腋生，假二歧分枝，向下生须根。叶小如芝麻，互生，无柄，覆瓦状排列成两行，叶片深裂分为背裂片和腹裂片两部份，背裂片长圆形或卵形，肉质，绿色，但在秋后常变为紫红色。孢子果双生于分枝处，大孢子果体积小；小孢子果体积远较大，球圆形或桃形，顶端有短喙，果壁薄而透明，内含多数具长柄的小孢子囊，每个小孢子囊内有64个小孢子，分别埋藏在5-8块无色海绵状的泡胶块上，泡胶块上有丝状毛。",habit:"喜温暖、光照充足、静水环境，繁殖迅速；与固氮蓝藻共生，繁殖快成优势水面漂浮植物。",harm:"繁殖速度快，掠夺了其它水生动植物的空间",area:"天门中学、陈家溪桥",count:1,"points":[[110.3136,29.0721],[110.2757,29.0647]]},

function searchPlant() {
    const keyword = document.getElementById('searchInput').value.trim();
    clearMarkers();
    const tb = document.getElementById('tableBody');
    tb.innerHTML = '';
    
    const result = keyword ? plants.filter(p => p.name.includes(keyword)) : plants;
    
    result.forEach(p => {
        const tr = document.createElement('tr');
        tr.innerHTML = `
            <td><img src="./${p.img}.jpg" class="plant-img" onerror="this.style.display='none'"></td>
            <td>${p.id}</td>
            <td>${p.name}</td>
            <td>${p.latin}</td>
            <td>${p.life}</td>
            <td>${p.origin}</td>
            <td>${p.geo}</td>
            <td>${p.group}</td>
            <td>${p.shape}</td>
            <td>${p.habit}</td>
            <td>${p.harm}</td>
            <td>${p.area}</td>
            <td>${p.count}</td>`;
        tb.appendChild(tr);

        // 修复了这里的逻辑：确保有points才会生成标记
        if (p.points && Array.isArray(p.points) && p.points.length > 0) {
            p.points.forEach(([lng, lat]) => {
                if (!lng || !lat) return;
                // 这里修正了经纬度顺序，确保标记正确
                const marker = L.marker([lat, lng]).addTo(map);
                marker.bindPopup(`<b>${p.name}</b><br>编号：${p.id}<br>${p.harm?.substring(0,60)}...`);
                currentMarkers.push(marker);
            });
        }
    });
}

function clearMarkers() {
    // 先把地图上所有的标记都删掉
    currentMarkers.forEach(m => {
        if (map.hasLayer(m)) {
            map.removeLayer(m);
        }
    });
    currentMarkers = [];
}

window.onload = function(){
    // 页面加载时自动显示所有数据和点位
    searchPlant();
    document.getElementById('searchInput').onkeyup = e => e.key === 'Enter' && searchPlant();
};
</script>
